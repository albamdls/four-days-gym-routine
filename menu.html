<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-title" content="A por ello">
<title>Menú semanal</title>
<style>
  :root { --bg: #000; --card: #1c1c1e; --line: #2c2c2e; --text: #fff; --muted: #8e8e93; --accent: #a6ff00; --red: #fa114f; --blue: #00d7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.35; padding-bottom: 30px; }
  body.lock { overflow: hidden; }
  button { font-family: inherit; }
  header { padding: 16px 16px 4px; max-width: 640px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .back { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 600; }
  .who { color: var(--muted); font-size: .85rem; font-weight: 600; }
  .week { max-width: 640px; margin: 0 auto; padding: 8px 16px 0; display: flex; align-items: center; gap: 8px; }
  .week button { flex: 0 0 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 1.2rem; cursor: pointer; }
  .week div { flex: 1; text-align: center; font-weight: 700; font-size: .95rem; }
  .week small { display: block; color: var(--muted); font-weight: 600; font-size: .75rem; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 5px; padding: 10px 16px; max-width: 640px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; min-width: 0; padding: 10px 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer; }
  nav button.today { border-color: var(--accent); color: var(--accent); }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #000; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 14px; }
  h1 { margin: 6px 0 12px; font-size: 2rem; letter-spacing: -.02em; }
  main h1 span { color: var(--muted); font-size: 1rem; font-weight: 600; letter-spacing: 0; }
  .sum { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 18px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; }
  .stat + .track + .stat { margin-top: 14px; }
  .stat b { font-size: 1.5rem; letter-spacing: -.01em; }
  .stat small { font-size: .85rem; font-weight: 600; margin-left: 3px; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .track { height: 8px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; }
  .tip { font-size: .88rem; font-weight: 600; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tip.ok { color: var(--accent); } .tip.warn { color: #ff9f0a; } .tip.info { color: var(--muted); font-weight: 400; }
  .meal { background: var(--card); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
  .pill { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #000; padding: 3px 9px; border-radius: 20px; }
  .time { color: var(--muted); font-size: .8rem; font-weight: 600; }
  .kcal { margin-left: auto; font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .kcal b { color: var(--text); font-size: .95rem; }
  .meal h2 { margin: 8px 16px 10px; font-size: 1.15rem; letter-spacing: -.01em; }
  .ing { display: grid; grid-template-columns: 78px 1fr auto; column-gap: 12px; padding: 9px 16px; border-top: 1px solid var(--line); align-items: baseline; }
  .ing b { text-align: right; font-weight: 700; white-space: nowrap; }
  .ing .k { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .ing.full { grid-template-columns: 1fr; color: #d1d1d6; }
  .note { color: var(--muted); font-size: .84rem; padding: 10px 16px; border-top: 1px solid var(--line); }
  .change { display: block; width: 100%; padding: 13px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--accent); font-size: .95rem; font-weight: 700; text-align: center; cursor: pointer; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions button { flex: 1; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .85rem; font-weight: 600; cursor: pointer; }
  .foot { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 16px; }
  /* Selector de plato */
  #sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; display: none; }
  #sheet.open { display: block; }
  .sh-head { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin: 0 auto; }
  .sh-head b { font-size: 1.1rem; }
  .sh-head button { background: transparent; border: 0; color: var(--accent); font-size: .95rem; font-weight: 700; cursor: pointer; padding: 6px 0; }
  .sh-body { max-width: 640px; margin: 0 auto; padding: 4px 16px 30px; }
  .sh-body h3 { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; color: var(--text); font-size: 1rem; cursor: pointer; }
  .opt.sel { border-color: var(--accent); }
  .opt span { flex: 1; font-weight: 600; }
  .opt small { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .opt em { font-style: normal; color: var(--accent); font-weight: 800; }

  /* Cabecera con el estilo del inicio */
  header { display: block; padding: 16px 16px 8px; max-width: 640px; margin: 0 auto; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .hero h1 { margin: 4px 0 0; font-size: 2.1rem; line-height: 1.05; letter-spacing: -.03em; }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .ic { flex: 0 0 48px; height: 48px; border-radius: 14px; background: var(--c, var(--accent)); color: #000; display: flex; align-items: center; justify-content: center; }
  .hero svg { display: block; }
  nav button, .week button { border-radius: 12px; }
  main h1 { font-size: 1.5rem; margin: 4px 0 12px; letter-spacing: -.02em; }
  .sum { background: linear-gradient(135deg, #1f2b00, #06242b); border: 1px solid #2f3d10; border-radius: 22px; }
  .meal { border-radius: 22px; }
  .actions button { border-radius: 14px; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">‹ Inicio</a>
  <div class="hero">
    <div><div class="eyebrow" id="goal"></div><h1>Menú de <span id="who"></span></h1></div>
    <span class="ic" id="badge"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.8-3.5 7v3H17"/></svg></span>
  </div>
</header>
<div class="week">
  <button id="prev" aria-label="Semana anterior">‹</button>
  <div id="weekLabel"></div>
  <button id="next" aria-label="Semana siguiente">›</button>
</div>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script src="datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search).get("quien");
const who = PEOPLE[q] ? q : "alba";
const P = PEOPLE[who];
const todayIdx = (new Date().getDay() + 6) % 7;
let offset = 0, current = todayIdx, days = getWeek(who, 0);

function bar(value, goal, color) {
  return '<div class="track"><i style="width:' + Math.min(100, Math.round(value / goal * 100)) + "%;background:" + color + '"></i></div>';
}

function render(keepScroll) {
  $("who").textContent = P.name;
  $("goal").textContent = "Objetivo " + P.kcalGoal + " kcal · " + P.protGoal + " g proteína";
  $("badge").style.background = who === "raquel" ? "#bf5af2" : "var(--red)";
  document.title = "Menú de " + P.name;
  $("weekLabel").innerHTML = weekLabel(offset) + "<small>" + (offset === 0 ? "esta semana" : offset === 1 ? "la semana que viene" : offset === -1 ? "la semana pasada" : "") +
    (storedWeek(who, offset) ? (offset >= -1 && offset <= 1 ? " · " : "") + "con cambios" : "") + "</small>";
  $("tabs").innerHTML = TABS.map((l, i) =>
    '<button data-i="' + i + '" class="' + (i === current ? "on" : "") + (offset === 0 && i === todayIdx ? " today" : "") + '" aria-label="' + DAYS[i] + '">' + l + "</button>").join("");

  let kcal = 0, prot = 0, free = false, cards = "";
  days[current].forEach((id, mi) => {
    const d = DISHES[id], slot = P.slots[mi], color = SLOT_COLORS[mi], t = dishTotal(d);
    if (t === null) free = true; else { kcal += t[0]; prot += t[1]; }
    cards += '<section class="meal"><div class="top"><span class="pill" style="background:' + color + '">' + slot[0] + '</span><span class="time">' + slot[1] + "</span>" +
      '<span class="kcal">' + (t === null ? "sin contar" : "<b>" + t[0] + "</b> kcal · <b>" + t[1] + "</b> g P") + "</span></div>" +
      "<h2>" + esc(d.n) + "</h2>" +
      d.i.map(g => {
        const qty = g[2] != null ? g[2] : g[1] + " g";
        const name = g[3] != null ? g[3] : FOODS[g[0]][0];
        if (qty === "") return '<div class="ing full">' + esc(name) + "</div>";
        const k = g[0] ? FOODS[g[0]][1] * g[1] / 100 : null;
        return '<div class="ing"><b style="color:' + color + '">' + esc(qty) + "</b><span>" + esc(name) + "</span>" +
          '<span class="k">' + (k === null ? "" : (FOODS[g[0]][3] === "G" ? "~" : "") + Math.round(k)) + "</span></div>";
      }).join("") +
      (d.note ? '<div class="note">' + esc(d.note) + "</div>" : "") +
      '<button class="change" data-change="' + mi + '">Cambiar plato</button></section>';
  });

  let tip;
  if (free) tip = '<div class="tip info">Hay una comida libre: el total no la incluye.</div>';
  else {
    const dk = kcal - P.kcalGoal, dp = P.protGoal - prot, msgs = [];
    if (dk > 100) msgs.push("te pasas " + dk + " kcal");
    if (dk < -100) msgs.push("te faltan " + (-dk) + " kcal");
    if (dp > 0) msgs.push("te faltan " + dp + " g de proteína");
    tip = msgs.length ? '<div class="tip warn">Ojo: ' + msgs.join(" y ") + ".</div>" : '<div class="tip ok">Día en objetivo.</div>';
  }

  $("main").innerHTML = "<h1>" + DAYS[current] + (offset === 0 && current === todayIdx ? " <span>hoy</span>" : "") + "</h1>" +
    '<div class="sum">' +
    '<div class="stat"><div><b style="color:var(--red)">' + kcal + "</b><small>kcal</small></div><span>objetivo " + P.kcalGoal + "</span></div>" + bar(kcal, P.kcalGoal, "var(--red)") +
    '<div class="stat"><div><b style="color:var(--blue)">' + prot + "</b><small>g de proteína</small></div><span>mínimo " + P.protGoal + "</span></div>" + bar(prot, P.protGoal, "var(--blue)") +
    tip + "</div>" + cards +
    '<div class="actions"><button id="copy">Copiar la semana anterior</button><button id="reset">Volver al menú base</button></div>' +
    '<div class="foot">A la derecha, las kcal de cada ingrediente; ~ indica un valor genérico (producto fresco, sin etiqueta).<br>Verdura libre en comidas y cenas. Los cambios se guardan en este dispositivo.</div>';
  if (!keepScroll) window.scrollTo(0, 0);
}

// ----- Selector de plato -----
let pickSlot = null;
function openPicker(mi) {
  pickSlot = mi;
  const type = P.slots[mi][2], cur = days[current][mi];
  const list = Object.keys(DISHES).filter(id => DISHES[id].t === type);
  const row = id => {
    const d = DISHES[id], t = dishTotal(d);
    return '<button class="opt' + (id === cur ? " sel" : "") + '" data-pick="' + id + '"><span>' + esc(d.n) + "</span>" +
      "<small>" + (t === null ? "sin contar" : t[0] + " kcal · " + t[1] + " g P") + "</small>" + (id === cur ? "<em>✓</em>" : "") + "</button>";
  };
  let body = "";
  const groupOf = id => DISHES[id].g || TYPE_NAMES[type];
  const groups = type === "p" ? GROUPS : list.map(groupOf).filter((g, i, all) => all.indexOf(g) === i);
  groups.forEach(g => {
    const items = list.filter(id => groupOf(id) === g);
    if (items.length) body += "<h3>" + g + "</h3>" + items.map(row).join("");
  });
  $("sheet").innerHTML = '<div class="sh-head"><b>' + P.slots[mi][0] + " del " + DAYS[current].toLowerCase() + '</b><button id="close">Cerrar</button></div><div class="sh-body">' + body + "</div>";
  $("sheet").classList.add("open"); $("sheet").scrollTop = 0; document.body.classList.add("lock");
}
function closePicker() { $("sheet").classList.remove("open"); document.body.classList.remove("lock"); pickSlot = null; }

$("sheet").addEventListener("click", ev => {
  if (ev.target.id === "close") return closePicker();
  const b = ev.target.closest("[data-pick]"); if (!b) return;
  days[current][pickSlot] = b.dataset.pick;
  setWeek(who, offset, days);
  closePicker(); render(true);
});

$("tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  current = Number(b.dataset.i); render();
});
$("prev").addEventListener("click", () => { offset--; days = getWeek(who, offset); render(); });
$("next").addEventListener("click", () => { offset++; days = getWeek(who, offset); render(); });
$("main").addEventListener("click", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.change !== undefined) openPicker(Number(t.dataset.change));
  else if (t.id === "copy") {
    if (!confirm("¿Copiar el menú de la semana anterior en esta semana?")) return;
    days = getWeek(who, offset - 1); setWeek(who, offset, days); render(true);
  } else if (t.id === "reset") {
    if (!confirm("¿Volver al menú base en esta semana? Se pierden los cambios.")) return;
    setWeek(who, offset, null); days = getWeek(who, offset); render(true);
  }
});
render();
</script>
</body>
</html>
