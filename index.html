<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-title" content="A por ello">
<title>Inicio</title>
<style>
  :root { --bg: #000; --card: #1c1c1e; --line: #2c2c2e; --text: #fff; --muted: #8e8e93; --accent: #a6ff00; --red: #fa114f; --blue: #00d7ff; --purple: #bf5af2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.35; }
  main { max-width: 640px; margin: 0 auto; padding: 22px 16px 34px; }
  .hero { position: relative; padding: 6px 110px 0 0; min-height: 112px; }
  .date { color: var(--muted); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  h1 { margin: 4px 0 0; font-size: 2.3rem; line-height: 1.05; letter-spacing: -.03em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rings { position: absolute; top: 0; right: 0; width: 104px; height: 104px; }
  .rings circle { fill: none; stroke-width: 9; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .rings .bg { opacity: .22; }
  .rings .fg { animation: draw 1.1s ease-out both; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } }
  @media (prefers-reduced-motion: reduce) { .rings .fg { animation: none; } }
  .quote { margin: 20px 0 14px; padding: 18px 18px 16px; border-radius: 22px; background: linear-gradient(135deg, #1f2b00, #06242b); border: 1px solid #2f3d10; }
  .quote p { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .quote button { margin-top: 12px; background: transparent; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
  .today { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: var(--card); margin-bottom: 22px; color: var(--text); text-decoration: none; }
  .today .ic { flex: 0 0 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; }
  .today small { display: block; color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .today b { font-size: 1.15rem; }
  .today em { display: block; font-style: normal; color: var(--muted); font-size: .88rem; }
  .go { margin-left: auto; color: var(--muted); font-size: 1.5rem; }
  h2 { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.tile { display: block; position: relative; overflow: hidden; min-height: 132px; padding: 16px; border-radius: 22px; background: var(--card); color: var(--text); text-decoration: none; border: 1px solid transparent; }
  a.tile:active { border-color: var(--c); }
  a.tile::after { content: ""; position: absolute; right: -34px; bottom: -34px; width: 110px; height: 110px; border-radius: 50%; background: var(--c); opacity: .14; }
  .tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--c); color: #000; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .tile b { display: block; font-size: 1.05rem; line-height: 1.2; }
  .tile span { display: block; color: var(--muted); font-size: .82rem; margin-top: 3px; }
  svg { display: block; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="date" id="date"></div>
    <h1 id="hello"></h1>
    <svg class="rings" viewBox="0 0 104 104" aria-hidden="true">
      <circle class="bg" cx="52" cy="52" r="46" stroke="#fa114f"/><circle class="fg" cx="52" cy="52" r="46" stroke="#fa114f" stroke-dasharray="289" stroke-dashoffset="64" style="--len:289"/>
      <circle class="bg" cx="52" cy="52" r="35" stroke="#a6ff00"/><circle class="fg" cx="52" cy="52" r="35" stroke="#a6ff00" stroke-dasharray="220" stroke-dashoffset="77" style="--len:220"/>
      <circle class="bg" cx="52" cy="52" r="24" stroke="#00d7ff"/><circle class="fg" cx="52" cy="52" r="24" stroke="#00d7ff" stroke-dasharray="151" stroke-dashoffset="30" style="--len:151"/>
    </svg>
  </div>

  <div class="quote">
    <p id="quote"></p>
    <button id="another">Otra frase ↻</button>
  </div>

  <a class="today" href="rutina.html">
    <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>
    <span><small>Hoy toca</small><b id="todayName"></b><em id="todayFocus"></em></span>
    <span class="go">›</span>
  </a>

  <h2>Tu espacio</h2>
  <div class="grid">
    <a class="tile" href="rutina.html" style="--c:var(--accent)">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>
      <b>Rutina de gimnasio</b><span>Torso/pierna · 4 días</span>
    </a>
    <a class="tile" href="compra.html" style="--c:var(--blue)">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>
      <b>Lista de la compra</b><span>Se calcula sola</span>
    </a>
    <a class="tile" href="menu.html?quien=alba" style="--c:var(--red)">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.8-3.5 7v3H17"/></svg></span>
      <b>Menú de Alba</b><span>Planifica tu semana</span>
    </a>
    <a class="tile" href="menu.html?quien=raquel" style="--c:var(--purple)">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.8-3.5 7v3H17"/></svg></span>
      <b>Menú de Raquel</b><span>Planifica tu semana</span>
    </a>
  </div>
</main>

<script>
// Frases: añade o quita las que quieras
const QUOTES = [
  "No hace falta que sea perfecto. Hace falta que sea hoy.",
  "La constancia gana a la motivación. Siempre.",
  "No se trata de tener ganas, se trata de ir.",
  "Entrena por la que serás dentro de tres meses.",
  "Poco a poco también es avanzar.",
  "Una serie más. Solo una.",
  "Las agujetas de hoy son la fuerza de mañana.",
  "Ya has hecho lo más difícil: empezar.",
  "Cada día cuenta, incluso los regulares.",
  "El sofá seguirá ahí cuando vuelvas.",
  "Come bien, entrena fuerte, descansa mejor.",
  "Los gnocchi se ganan en la prensa.",
  "No compites con nadie. Solo con la de ayer.",
  "Un mal día no borra una buena semana."
];
// Entrenamiento por día de la semana (0 = domingo)
const TRAINING = { 1: ["Torso A", "Espalda y pecho"], 2: ["Pierna A", "Cuádriceps"], 4: ["Torso B", "Hombros y brazos"], 5: ["Pierna B", "Glúteo y femoral"] };

const $ = id => document.getElementById(id);
const now = new Date(), h = now.getHours();
const hello = h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches";
$("hello").innerHTML = hello + ",<br><span>a por ello</span>";
const dateText = now.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
$("date").textContent = dateText;

const t = TRAINING[now.getDay()];
$("todayName").textContent = t ? t[0] : "Descanso";
$("todayFocus").textContent = t ? t[1] : "Recupera, pasea y come bien";

// Una frase distinta cada día; el botón pasa a la siguiente
let qi = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000)) % QUOTES.length;
function showQuote() { $("quote").textContent = QUOTES[qi]; }
$("another").addEventListener("click", () => { qi = (qi + 1) % QUOTES.length; showQuote(); });
showQuote();
</script>
</body>
</html>
