<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Mi rutina</title>
<style>
  :root {
    --bg: #000000; --card: #1c1c1e; --line: #2c2c2e; --text: #ffffff;
    --muted: #8e8e93; --accent: #a6ff00; --ok: #a6ff00; --red: #fa114f; --blue: #00d7ff;
  }
  .card.done { border-color: var(--accent); }
  .btn.mini {
    display: block; width: 100%; margin-top: 8px; padding: 10px; font-size: .9rem;
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
  }
  .btn.mini.saved { background: var(--accent); color: #000; }
  .last b { color: var(--blue); font-weight: 600; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4; padding-bottom: 90px;
  }
  header { padding: 18px 16px 8px; max-width: 640px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.4rem; }
  .back { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 600; display: inline-block; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  nav {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; gap: 6px; padding: 10px 16px; max-width: 640px; margin: 0 auto;
    border-bottom: 1px solid var(--line);
  }
  nav button {
    flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  nav button svg { display: block; margin: 0 auto; pointer-events: none; }
  nav button[aria-label] { flex: 0 0 48px; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #000; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card h2 { margin: 0; font-size: 1rem; }
  .card h2 a { color: var(--text); text-decoration: none; display: block; }
  .card h2 a span { color: var(--blue); font-size: .8rem; font-weight: 600; margin-left: 4px; white-space: nowrap; }
  .target { color: var(--red); font-size: .85rem; font-weight: 600; }
  .last { color: var(--muted); font-size: .82rem; margin: 6px 0 10px; }
  .set { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .set span { color: var(--muted); font-size: .85rem; text-align: center; }
  input[type=text], input[type=date] {
    width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; text-align: center;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 16px;
  }
  .bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  .bar input { flex: 0 0 150px; }
  .btn {
    flex: 1; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
    color: #000; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .btn.sec { background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .btn.del { flex: 0 0 auto; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-size: .8rem; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  .sess-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sess ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: .88rem; }
  .sess li b { color: var(--text); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--ok); color: #06281a; padding: 10px 18px; border-radius: 20px;
    font-weight: 700; font-size: .9rem; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* Cabecera con el estilo del inicio */
  header { display: block; padding: 16px 16px 8px; max-width: 640px; margin: 0 auto; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .hero h1 { margin: 4px 0 0; font-size: 2.1rem; line-height: 1.05; letter-spacing: -.03em; }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .ic { flex: 0 0 48px; height: 48px; border-radius: 14px; background: var(--c, var(--accent)); color: #000; display: flex; align-items: center; justify-content: center; }
  .hero svg { display: block; }
  nav button, .week button { border-radius: 12px; }
  .back { margin-bottom: 0; }
  .card { border-radius: 22px; border-color: transparent; padding: 16px; }
  .card.done { border-color: var(--accent); }
  .card h2 { font-size: 1.1rem; letter-spacing: -.01em; }
  input[type=text], input[type=date] { border-radius: 12px; }
  .btn { border-radius: 12px; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">‹ Inicio</a>
  <div class="hero">
    <div><div class="eyebrow" id="subtitle"></div><h1>Mi <span>rutina</span></h1></div>
    <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>
  </div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div class="bar" id="bar">
  <div class="in">
    <input type="date" id="date">
    <button class="btn" id="save">Guardar sesión</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ---------- RUTINA: edita aquí si cambias ejercicios ----------
const ROUTINE = [
  { tab: "Lun", name: "Torso A", focus: "Espalda y pecho", weekday: 1, ex: [
    ["Jalón al pecho", 3, "8-12"],
    ["Press de pecho (máquina o banco)", 3, "8-12"],
    ["Remo sentado (polea o máquina)", 3, "10-12"],
    ["Press de hombro (agarre neutro)", 3, "8-12"],
    ["Elevaciones laterales con mancuernas", 3, "12-15"],
    ["Curl de bíceps con mancuernas", 2, "10-15"],
    ["Extensión de tríceps en polea", 2, "10-15"] ] },
  { tab: "Mar", name: "Pierna A", focus: "Cuádriceps", weekday: 2, ex: [
    ["Prensa (pies a media altura)", 3, "10-12"],
    ["Hip thrust en máquina", 3, "12-15"],
    ["Extensión de cuádriceps", 3, "12-15"],
    ["Curl femoral sentado", 3, "10-15"],
    ["Gemelo en máquina", 3, "12-15"] ] },
  { tab: "Jue", name: "Torso B", focus: "Hombros y brazos", weekday: 4, ex: [
    ["Press de hombro en máquina (agarre neutro)", 3, "8-12"],
    ["Remo en máquina con pecho apoyado", 3, "8-12"],
    ["Press inclinado con mancuernas", 2, "10-12"],
    ["Jalón con agarre neutro", 3, "10-12"],
    ["Elevaciones laterales en polea", 3, "12-15"],
    ["Face pull", 2, "12-15"],
    ["Curl en polea", 3, "10-15"],
    ["Tríceps con cuerda", 3, "10-15"] ] },
  { tab: "Vie", name: "Pierna B", focus: "Glúteo y femoral", weekday: 5, ex: [
    ["Hip thrust", 3, "8-12"],
    ["Sentadilla goblet a banco", 3, "10-12"],
    ["Curl femoral tumbado", 3, "10-15"],
    ["Abducción en máquina", 3, "12-15"],
    ["Patada de glúteo (polea o máquina)", 2, "12-15"],
    ["Crunch en máquina", 3, "10-15"] ] }
];

// ---------- DATOS ----------
const KEY = "rutina-log-v1";
let data = { sessions: [], drafts: {} };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) data = Object.assign(data, JSON.parse(raw));
} catch (e) {}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { toast("No se pudo guardar en este navegador"); }
}

// ---------- UTILIDADES ----------
const $ = id => document.getElementById(id);
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso) { const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function imgUrl(name) {
  return "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(name + " ejercicio gimnasio");
}
function setsText(sets) {
  return sets.map(s => (s.kg !== "" ? s.kg + " kg" : "—") + " × " + (s.reps !== "" ? s.reps : "—")).join(" · ");
}
function lastFor(exName) {
  const sorted = data.sessions.slice().sort((a, b) => b.date.localeCompare(a.date));
  for (const s of sorted) if (s.entries[exName]) return { date: s.date, sets: s.entries[exName] };
  return null;
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- VISTAS ----------
let current = ROUTINE.findIndex(d => d.weekday === new Date().getDay());
if (current < 0) current = 0;

function renderTabs() {
  const icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>';
  const labels = ROUTINE.map(d => d.tab).concat([icon]);
  $("tabs").innerHTML = labels.map((l, i) =>
    '<button data-i="' + i + '" class="' + (i === current ? "on" : "") + '"' + (i === ROUTINE.length ? ' aria-label="Historial" title="Historial"' : "") + ">" + l + "</button>").join("");
}

function renderDay() {
  const day = ROUTINE[current];
  const draft = data.drafts[current] || {};
  $("subtitle").textContent = day.name + " · " + day.focus;
  $("bar").style.display = "";
  let html = "";
  day.ex.forEach((e, ei) => {
    const name = e[0], nSets = e[1], reps = e[2];
    const last = lastFor(name);
    const done = !!(draft._done && draft._done[ei]);
    html += '<div class="card' + (done ? " done" : "") + '"><h2><a href="' + imgUrl(name) + '" target="_blank" rel="noopener">' + esc(name) + ' <span>Ver ↗</span></a></h2><div class="target">' + nSets + " × " + esc(reps) + "</div>";
    html += '<div class="last">' + (last ? "Última vez (" + fmtDate(last.date) + "): <b>" + esc(setsText(last.sets)) + "</b>" : "Sin registros todavía") + "</div>";
    for (let s = 0; s < nSets; s++) {
      const d = (draft[ei] && draft[ei][s]) || {};
      const ph = last && last.sets[s] ? last.sets[s] : {};
      html += '<div class="set"><span>' + (s + 1) + "</span>" +
        '<input type="text" inputmode="decimal" data-e="' + ei + '" data-s="' + s + '" data-f="kg" placeholder="' + esc(ph.kg !== undefined && ph.kg !== "" ? ph.kg + " kg" : "kg") + '" value="' + esc(d.kg || "") + '" aria-label="Peso serie ' + (s + 1) + '">' +
        '<input type="text" inputmode="numeric" data-e="' + ei + '" data-s="' + s + '" data-f="reps" placeholder="' + esc(ph.reps !== undefined && ph.reps !== "" ? ph.reps + " reps" : "reps") + '" value="' + esc(d.reps || "") + '" aria-label="Repeticiones serie ' + (s + 1) + '">' +
        "</div>";
    }
    html += '<button class="btn mini" data-save="' + ei + '">' + "Guardar datos</button></div>";
  });
  $("main").innerHTML = html;
}

function renderHistory() {
  $("subtitle").textContent = "Historial y copia de seguridad";
  $("bar").style.display = "none";
  let html = '<div class="row"><button class="btn sec" id="exp">Exportar copia</button>' +
    '<button class="btn sec" id="imp">Importar copia</button>' +
    '<input type="file" id="file" accept="application/json,.json" hidden></div>';
  const sorted = data.sessions.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (!sorted.length) html += '<div class="empty">Aún no has guardado ninguna sesión.</div>';
  sorted.forEach(s => {
    html += '<div class="card sess"><div class="sess-head"><h2>' + fmtDate(s.date) + " · " + esc(s.dayName) + "</h2>" +
      '<button class="btn del" data-del="' + esc(s.id) + '">Borrar</button></div><ul>';
    Object.keys(s.entries).forEach(n => { html += "<li><b>" + esc(n) + ":</b> " + esc(setsText(s.entries[n])) + "</li>"; });
    html += "</ul></div>";
  });
  $("main").innerHTML = html;
}

function render() {
  renderTabs();
  if (current < ROUTINE.length) renderDay(); else renderHistory();
  window.scrollTo(0, 0);
}

// ---------- EVENTOS ----------
$("tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  current = Number(b.dataset.i); render();
});

$("main").addEventListener("input", ev => {
  const i = ev.target; if (!i.dataset || i.dataset.f === undefined) return;
  const d = data.drafts[current] = data.drafts[current] || {};
  const e = d[i.dataset.e] = d[i.dataset.e] || {};
  const s = e[i.dataset.s] = e[i.dataset.s] || {};
  s[i.dataset.f] = i.value.trim();
  persist();
});

$("save").addEventListener("click", () => {
  const day = ROUTINE[current];
  const draft = data.drafts[current] || {};
  const entries = {};
  day.ex.forEach((e, ei) => {
    const sets = [];
    for (let s = 0; s < e[1]; s++) {
      const d = (draft[ei] && draft[ei][s]) || {};
      const kg = (d.kg || "").replace(",", "."), reps = d.reps || "";
      if (kg !== "" || reps !== "") sets.push({ kg: kg, reps: reps });
    }
    if (sets.length) entries[e[0]] = sets;
  });
  if (!Object.keys(entries).length) { toast("No hay nada que guardar"); return; }
  data.sessions.push({ id: String(Date.now()), date: $("date").value || today(), dayName: day.name, entries: entries });
  delete data.drafts[current];
  persist(); render(); toast("Sesión guardada");
});

$("main").addEventListener("click", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.save !== undefined) {
    const d = data.drafts[current] = data.drafts[current] || {};
    d._done = d._done || {};
    d._done[t.dataset.save] = true;
    persist();
    t.closest(".card").classList.add("done");
    t.textContent = "Guardado ✓";
    t.classList.add("saved");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.textContent = "Guardar datos";
      t.classList.remove("saved");
    }, 2000);
  } else if (t.dataset && t.dataset.del) {
    if (confirm("¿Borrar esta sesión?")) {
      data.sessions = data.sessions.filter(s => s.id !== t.dataset.del);
      persist(); render();
    }
  } else if (t.id === "exp") {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "rutina-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  } else if (t.id === "imp") {
    $("file").click();
  }
});

$("main").addEventListener("change", ev => {
  if (ev.target.id !== "file" || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const inc = JSON.parse(r.result);
      if (!inc || !Array.isArray(inc.sessions)) throw new Error();
      if (!confirm("Se sustituirán los datos actuales por los de la copia. ¿Continuar?")) return;
      data = { sessions: inc.sessions, drafts: inc.drafts || {} };
      persist(); render(); toast("Copia importada");
    } catch (e) { toast("Archivo no válido"); }
  };
  r.readAsText(ev.target.files[0]);
});

$("date").value = today();
render();
</script>
</body>
</html>
