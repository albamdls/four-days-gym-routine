<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Lista de la compra</title>
<style>
  :root { --bg: #000; --card: #1c1c1e; --line: #2c2c2e; --text: #fff; --muted: #8e8e93; --accent: #a6ff00; --red: #fa114f; --blue: #00d7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.35; padding-bottom: 30px; }
  button { font-family: inherit; }
  header { padding: 16px 16px 4px; max-width: 640px; margin: 0 auto; }
  .back { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 600; }
  .week { max-width: 640px; margin: 0 auto; padding: 8px 16px 0; display: flex; align-items: center; gap: 8px; }
  .week button { flex: 0 0 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 1.2rem; cursor: pointer; }
  .week div { flex: 1; text-align: center; font-weight: 700; font-size: .95rem; }
  .week small { display: block; color: var(--muted); font-weight: 600; font-size: .75rem; min-height: 1em; }
  nav { display: flex; gap: 5px; padding: 10px 16px; max-width: 640px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; padding: 10px 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #000; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 14px; }
  h1 { margin: 6px 0 12px; font-size: 2rem; letter-spacing: -.02em; }
  .sum { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 18px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; }
  .stat b { font-size: 1.5rem; color: var(--accent); }
  .stat small { font-size: .85rem; font-weight: 600; margin-left: 4px; }
  .track { height: 8px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .2s; }
  .reset { background: transparent; border: 0; color: var(--muted); font-size: .85rem; font-weight: 600; padding: 4px 0; cursor: pointer; }
  .cat { background: var(--card); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
  .cat h2 { margin: 0; padding: 14px 16px 10px; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  label.item { display: grid; grid-template-columns: 26px 1fr auto; column-gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  label.item input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 50%; border: 2px solid #48484a; background: transparent; cursor: pointer; }
  label.item input:checked { background: var(--accent); border-color: var(--accent); }
  label.item input:checked::after { content: ""; display: block; width: 6px; height: 11px; margin: 2px 0 0 7px; border: solid #000; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .name::first-letter { text-transform: uppercase; }
  .sub { color: var(--muted); font-size: .8rem; }
  .qty { font-weight: 700; white-space: nowrap; text-align: right; }
  .qty small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  label.item.done .name, label.item.done .qty { color: var(--muted); }
  label.item.done .name { text-decoration: line-through; }
  .foot { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 16px; }

  /* Cabecera con el estilo del inicio */
  header { display: block; padding: 16px 16px 8px; max-width: 640px; margin: 0 auto; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .hero h1 { margin: 4px 0 0; font-size: 2.1rem; line-height: 1.05; letter-spacing: -.03em; }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .ic { flex: 0 0 48px; height: 48px; border-radius: 14px; background: var(--c, var(--accent)); color: #000; display: flex; align-items: center; justify-content: center; }
  .hero svg { display: block; }
  nav button, .week button { border-radius: 12px; }
  .sum { background: linear-gradient(135deg, #1f2b00, #06242b); border: 1px solid #2f3d10; border-radius: 22px; }
  .cat { border-radius: 22px; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">‹ Inicio</a>
  <div class="hero">
    <div><div class="eyebrow">Con los menús de la semana</div><h1>Lista de la <span>compra</span></h1></div>
    <span class="ic" style="--c:var(--blue)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>
  </div>
</header>
<div class="week">
  <button id="prev" aria-label="Semana anterior">‹</button>
  <div id="weekLabel"></div>
  <button id="next" aria-label="Semana siguiente">›</button>
</div>
<nav id="tabs"></nav>
<main id="main"></main>

<script src="datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const VIEWS = [["conjunta", "Conjunta"], ["alba", "Alba"], ["raquel", "Raquel"]];
const q = new URLSearchParams(location.search).get("quien");
let view = VIEWS.some(v => v[0] === q) ? q : "conjunta";
let offset = 0;

let CHECKS = {};
try { CHECKS = JSON.parse(localStorage.getItem("compra-v2")) || {}; } catch (e) {}
function persist() { try { localStorage.setItem("compra-v2", JSON.stringify(CHECKS)); } catch (e) {} }
function bucket() { const k = weekKey(offset) + "|" + view; return CHECKS[k] = CHECKS[k] || {}; }

function num(n) { return String(Math.round(n * 10) / 10).replace(".", ","); }
function amount(key, g) {             // cantidad principal y, si aplica, su peso entre paréntesis
  const u = FOODS[key][5];
  if (u === "ml") return [g >= 1000 ? num(g / 1000) + " l" : Math.round(g) + " ml", ""];
  if (Array.isArray(u)) { const n = Math.ceil(g / u[0] - 0.01); return [n + " " + (n === 1 ? u[1] : u[2]), Math.round(g) + " g"]; }
  return [g >= 1000 ? String(Math.round(g / 10) / 100).replace(".", ",") + " kg" : Math.round(g) + " g", ""];
}

// Suma los ingredientes de la semana planificada de cada persona
function build() {
  const people = view === "conjunta" ? Object.keys(PEOPLE) : [view];
  const foods = {}, extras = {}; let coffee = false;
  people.forEach(w => getWeek(w, offset).forEach(day => day.forEach(id => {
    const d = DISHES[id];
    if (d.t === "c" && id !== "sinCafe") coffee = true;
    d.i.forEach(g => {
      if (g[0]) { foods[g[0]] = foods[g[0]] || {}; foods[g[0]][w] = (foods[g[0]][w] || 0) + g[1]; }
      else if (g[2] === "Libre" || g[2] === "Al gusto") extras[g[3]] = true;
    });
  })));
  const cats = SECTIONS.map(sec => [sec, Object.keys(FOODS).filter(k => foods[k] && FOODS[k][4] === sec).map(k => {
    const per = foods[k], total = people.reduce((n, w) => n + (per[w] || 0), 0), a = amount(k, total);
    let sub = "";
    if (people.length > 1) {
      const parts = people.filter(w => per[w]);
      sub = parts.length === 1 ? PEOPLE[parts[0]].name : parts.map(w => PEOPLE[w].name + " " + amount(k, per[w])[0]).join(" · ");
    }
    return [k, FOODS[k][0], a[0], a[1], sub];
  })]);
  cats.find(c => c[0] === "Suplementos")[1].push(["x-creatina", "creatina", "3-5 g al día", "", people.length > 1 ? "cada una" : ""]);
  const free = Object.keys(extras).sort().map(n => ["x-" + n, n, "Al gusto", "", ""]);
  if (coffee) free.push(["x-cafe", "café", "Al gusto", "", ""]);
  if (free.length) cats.push(["Al gusto", free]);
  return cats.filter(c => c[1].length);
}

function render() {
  $("weekLabel").innerHTML = weekLabel(offset) + "<small>" + (offset === 0 ? "esta semana" : offset === 1 ? "la semana que viene" : offset === -1 ? "la semana pasada" : "") + "</small>";
  $("tabs").innerHTML = VIEWS.map(v => '<button data-v="' + v[0] + '" class="' + (v[0] === view ? "on" : "") + '">' + v[1] + "</button>").join("");
  const cats = build(), b = bucket(), total = cats.reduce((n, c) => n + c[1].length, 0);
  let html = '<div class="sum"><div class="stat"><div><b id="count">0</b><small>de ' + total + ' productos</small></div>' +
    '<button class="reset" id="reset">Desmarcar todo</button></div><div class="track"><i id="bar"></i></div></div>';
  cats.forEach(c => {
    html += '<section class="cat"><h2>' + c[0] + "</h2>";
    c[1].forEach(it => {
      const on = !!b[it[0]];
      html += '<label class="item' + (on ? " done" : "") + '"><input type="checkbox" data-k="' + esc(it[0]) + '"' + (on ? " checked" : "") + ">" +
        '<span><div class="name">' + esc(it[1]) + "</div>" + (it[4] ? '<div class="sub">' + esc(it[4]) + "</div>" : "") + "</span>" +
        '<span class="qty">' + esc(it[2]) + (it[3] ? "<small>" + esc(it[3]) + "</small>" : "") + "</span></label>";
    });
    html += "</section>";
  });
  html += '<div class="foot">Se calcula con el menú planificado de esa semana en este dispositivo.<br>Son cantidades exactas: redondea al envase.</div>';
  $("main").innerHTML = html;
  $("main").dataset.total = total;
  updateSum();
}
function updateSum() {
  const b = bucket(), total = Number($("main").dataset.total);
  const done = document.querySelectorAll("label.item input:checked").length;
  $("count").textContent = done;
  $("bar").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
}

$("tabs").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; view = b.dataset.v; render(); });
$("prev").addEventListener("click", () => { offset--; render(); });
$("next").addEventListener("click", () => { offset++; render(); });
$("main").addEventListener("change", ev => {
  const i = ev.target; if (!i.dataset || !i.dataset.k) return;
  const b = bucket();
  if (i.checked) b[i.dataset.k] = true; else delete b[i.dataset.k];
  i.closest(".item").classList.toggle("done", i.checked);
  persist(); updateSum();
});
$("main").addEventListener("click", ev => {
  if (ev.target.id !== "reset") return;
  CHECKS[weekKey(offset) + "|" + view] = {}; persist(); render();
});
render();
</script>
</body>
</html>
